name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Actions 탭에서 직접 실행할 수도 있게 한다
  workflow_dispatch:

# 기본 권한은 읽기만. Pages 배포에 필요한 권한은 deploy job 에만 준다.
permissions:
  contents: read

# 같은 브랜치(또는 PR)에서 새 실행이 시작되면 이전 실행을 취소한다.
# 단, main 배포는 중간에 끊기지 않도록 취소하지 않는다.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      # PR 에서는 배포하지 않으므로 배포용 결과물도 올리지 않는다
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    # PR 에서는 build 만 돌고 deploy 는 건너뛴다
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
